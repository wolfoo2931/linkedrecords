name: Start Authentik
description: Starts the hermetic Authentik instance bundled with this action, used by TEST_IDP=authentik, and waits for it to become healthy. Reads TEST_USERS_PWD from the job environment, same as the wdio suite itself.
runs:
  using: composite
  steps:
    - name: Start Authentik
      shell: bash
      run: docker compose -f "${{ github.action_path }}/docker-compose.yml" up -d --wait
    - name: Apply E2E blueprint
      shell: bash
      # Retried: docker compose --wait only waits for the containers to be healthy, not
      # for authentik's own background blueprint discovery (which provisions the flows,
      # certificate and scope mappings this blueprint's !Find lookups depend on) to finish
      # applying on a freshly started worker. Applying is idempotent (state: present), so
      # retrying until those system blueprints have caught up is safe.
      run: |
        for i in $(seq 1 24); do
          if docker compose -f "${{ github.action_path }}/docker-compose.yml" exec -T worker ak apply_blueprint custom/e2e-test-setup.yaml; then
            exit 0
          fi
          echo "Apply E2E blueprint failed (attempt $i/24), retrying in 5s..."
          sleep 5
        done
        echo "Apply E2E blueprint did not succeed after 24 attempts"
        exit 1
    - name: Show Authentik logs on failure
      if: failure()
      shell: bash
      run: docker compose -f "${{ github.action_path }}/docker-compose.yml" logs
